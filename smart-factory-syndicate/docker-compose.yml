version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart_factory_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_factory}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_factory}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_factory_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend_ai:
    build:
      context: ./backend_ai
      dockerfile: Dockerfile
    container_name: smart_factory_backend_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smart_factory}
      REDIS_URL: redis://redis:6379/0
      FLEETBASE_HOST: ${FLEETBASE_HOST:-http://host.docker.internal:8000}
      FLEETBASE_API_KEY: ${FLEETBASE_API_KEY:-flb_test_key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend_ai:/app

  backend_gateway:
    build:
      context: ./backend_gateway
      dockerfile: Dockerfile
    container_name: smart_factory_gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      BACKEND_AI_URL: http://backend_ai:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - backend_ai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_factory_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:5000
    depends_on:
      - backend_ai

volumes:
  pgdata:
  redisdata:

